              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hosanna.session_token
      description: Better Auth session cookie forwarded to the auth app for validation (cookie name may vary by Better Auth version/prefix).
    bearerAuth:
      type: http
      scheme: bearer
      description: "Better Auth session token (Authorization: Bearer), validated via the auth app."
    cronSecret:
      type: http
      scheme: bearer
      description: CRON_SECRET for /api/cron/*
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              description: Additional structured error context
          required:
            - code
            - message
          additionalProperties: false
          description: Error payload details
      required:
        - error
      additionalProperties: false
      description: Standard Hosanna API error envelope
    Checkpoint:
      anyOf:
        - type: object
          properties:
            updatedAt:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              description: Unix epoch timestamp in milliseconds
            id:
              type: string
              description: Document unique identifier
          required:
            - updatedAt
            - id
          additionalProperties: false
        - type: "null"
      description: Replication checkpoint cursor
    Song:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique song UUID
        orgId:
          type: string
          description: Organization ID owning the song
        title:
          type: string
          description: Song title
        artist:
          description: Artist or songwriter
          type: string
        content:
          description: ChordPro song lyrics and chords
          type: string
        folderId:
          description: Parent folder ID, null for root
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: "null"
        path:
          description: Full path in folder tree
          type: string
        tags:
          default: []
          description: Song tags / categories
          type: array
          items:
            type: string
        song_number:
          description: Catalog or hymnal number
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            - type: "null"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          description: Creation timestamp (ISO 8601)
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          description: Last updated timestamp (ISO 8601)
        deleted:
          default: false
          description: Soft-deleted flag
          type: boolean
        purgeAt:
          description: Trash retention purge deadline
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: "null"
        collectionIds:
          default: []
          description: Associated collection UUIDs
