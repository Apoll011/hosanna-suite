openapi: 3.1.0
info:
  title: Hosanna API
  version: 2.22.2
  description: |-
    Production REST API for Hosanna Studio and the Flutter musician app.
    Authentication is Better Auth (session cookie or Bearer). `/api/auth/*` is owned by Better Auth
    and is not expanded here. MCP lives at `/mcp` (outside this document).

    Identity-adjacent routes moved to auth.hosanna.live: `/api/notifications*`, `/api/billing/*`,
    `/api/backup*`, `/api/cron/agenda-reminders`. This API keeps domain music routes and
    `/api/cron/purge-trash`.
  license:
    name: Apache-2.0
servers:
  - url: https://api.hosanna.live/api
    description: Production API (domain data)
  - url: https://auth.hosanna.live/api
    description: Auth host (notifications, billing probes, backup, agenda cron)
  - url: http://localhost:3000/api
    description: Local API
tags:
  - name: Health
  - name: Billing
  - name: Cron
  - name: Songs
  - name: Folders
  - name: Services
  - name: ServiceNotes
  - name: Annotations
  - name: Replication
  - name: Trash
  - name: Backup
  - name: AI
  - name: Integrations
  - name: Notifications
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
      tags:
        - Health
      description: Returns API service health, database connectivity status, and server timestamp.
      operationId: getHealth
      security: []
  /billing/pricing:
    get:
      tags:
        - Billing
      summary: Public plan display prices
      operationId: getBillingPricing
      security: []
      description: Returns public localized subscription pricing tiers from Global Config.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPricing"
  /billing/entitlement:
    get:
      tags:
        - Billing
      summary: Org subscription entitlement
      operationId: getBillingEntitlement
      security: &a10
        - cookieAuth: []
        - bearerAuth: []
      description: Check active subscription entitlements and feature gates for the authenticated organization.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitled:
                    type: boolean
  /cron/agenda-reminders:
    get:
      tags:
        - Cron
      summary: "Cron: agenda-reminders"
      operationId: getCronAgendaReminders
      security: &a1
        - cronSecret: []
      description: Dispatch morning notifications for musicians with upcoming scheduled services.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags:
        - Cron
      summary: "Cron: agenda-reminders"
      operationId: postCronAgendaReminders
      security: *a1
      description: Dispatch morning notifications for musicians with upcoming scheduled services.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /cron/purge-trash:
    get:
      summary: "Cron: purge-trash"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged:
                    type: integer
                    description: Count of purged items
      tags:
        - Cron
      description: Trigger background job to purge soft-deleted items whose purgeAt date has expired.
      operationId: getCronPurgeTrash
      security: &a2
        - cronSecret: []
    post:
      summary: "Cron: purge-trash"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged:
                    type: integer
                    description: Count of purged items
      tags:
        - Cron
      description: Trigger background job to purge soft-deleted items whose purgeAt date has expired.
      operationId: postCronPurgeTrash
      security: *a2
  /songs/import/jobs:
    post:
      summary: Start a Logos AI song-import job (photo/gallery/PDF)
      responses:
        "202":
          description: Job created and queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - queued
      tags:
        - Songs
      description: Accepts a sheet-music image (and optional extra page screenshots for PDFs). Returns 202 with a job id immediately; poll GET /songs/import/jobs/{id} for real step progress. Cancel with DELETE. Does not persist a song — the client reviews the draft then creates locally.
      operationId: createSongImportJob
      security: &a3
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceType:
                  type: string
                  enum:
                    - photo
                    - gallery
                    - pdf
                imageBase64:
                  type: string
                  minLength: 1
                imageMimeType:
                  default: image/jpeg
                  type: string
                  minLength: 1
                imagesBase64:
                  maxItems: 4
                  type: array
                  items:
                    type: string
                    minLength: 1
                imageMimeTypes:
                  maxItems: 4
                  type: array
                  items:
                    type: string
                    minLength: 1
                pdfBase64:
                  type: string
                  minLength: 1
                fileName:
                  type: string
                  maxLength: 255
              required:
                - sourceType
                - imageBase64
              additionalProperties: false
  /songs/import/jobs/{id}:
    get:
      summary: Poll a Logos AI song-import job
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongImportJob"
      tags:
        - Songs
      description: Poll import job status, progress steps, and extracted ChordPro content.
      operationId: getSongImportJob
      security: *a3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
    delete:
      summary: Cancel a running Logos AI song-import job
      responses:
        "200":
          description: Job cancelled (or already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongImportJob"
      tags:
        - Songs
      description: Cancel an active song import pipeline job.
      operationId: cancelSongImportJob
      security: *a3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /songs:
    get:
      summary: List songs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Song"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
      tags:
        - Songs
      description: Paginated song library query with optional text search, tag filtering, folder scoping, and sort order.
      operationId: listSongs
      security: *a3
      parameters:
        - name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: folder
          in: query
          required: false
          schema:
            type: string
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            default: title
            type: string
            enum:
              - title
              - artist
              - createdAt
              - updatedAt
        - name: sortOrder
          in: query
          required: false
          schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
        - name: searchFields
          in: query
          required: false
          schema:
            type: string
    post:
      summary: Create song
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "401":
          description: Unauthorized
      tags:
        - Songs
      description: Create a new song document with ChordPro content and folder assignment.
      operationId: createSong
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                artist:
                  type: string
                content:
                  type: string
                folderId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
                song_number:
                  anyOf:
                    - type: number
                      exclusiveMinimum: 0
                    - type: "null"
                path:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
              required:
                - title
              additionalProperties: false
  /songs/batch:
    post:
      summary: Create songs batch
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"
      tags:
        - Songs
      description: Batch import or insert multiple song records in a single transactional request.
      operationId: createSongsBatch
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - songs
              properties:
                songs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: true
  /songs/batch-tags:
    put:
      summary: Batch update song tags
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
      tags:
        - Songs
      description: Apply tag modifications (append, replace, or remove) across multiple song IDs.
      operationId: batchUpdateSongTags
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                songIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                tags:
                  minItems: 1
                  type: array
                  items:
                    type: string
                mode:
                  default: append
                  type: string
                  enum:
                    - append
                    - replace
                    - remove
              required:
                - songIds
                - tags
              additionalProperties: false
  /songs/{id}:
    get:
      summary: Get song
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
      tags:
        - Songs
      description: Retrieve a single song by its UUID.
      operationId: getSong
      security: *a3
      parameters: &a4
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    put:
      summary: Update song
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "409":
          description: Conflict - song was modified concurrently
      tags:
        - Songs
      description: Update song metadata, title, or ChordPro content. Enforces optimistic concurrency via updatedAt.
      operationId: updateSong
      security: *a3
      parameters: *a4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updatedAt:
                  type: string
                  format: date-time
                title:
                  type: string
                  minLength: 1
                artist:
                  type: string
                content:
                  type: string
                folderId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
                song_number:
                  anyOf:
                    - type: number
                      exclusiveMinimum: 0
                    - type: "null"
                path:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
              required:
                - updatedAt
              additionalProperties: false
    delete:
      summary: Delete song
      responses:
        "204":
          description: Deleted
      tags:
        - Songs
      description: Soft-delete a song into trash.
      operationId: deleteSong
      security: *a3
      parameters: *a4
  /songs/{id}/download:
    get:
      summary: Download song ChordPro
      responses:
        "200":
          description: ChordPro file
          content:
            text/vnd.chordpro:
              schema:
                type: string
      tags:
        - Songs
      description: Download raw ChordPro text representation as a file attachment.
      operationId: downloadSong
      security: *a3
      parameters: *a4
  /songs/{id}/move:
    put:
      summary: Move song
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
      tags:
        - Songs
      description: Move song into another folder or to library root (null folderId).
      operationId: moveSong
      security: *a3
      parameters: *a4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updatedAt:
                  type: string
                  format: date-time
                folderId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
                newPath:
                  type: string
              required:
                - updatedAt
                - folderId
              additionalProperties: false
  /folders:
    get:
      summary: List folders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
      tags:
        - Folders
      description: Retrieve complete folder hierarchy with song and subfolder counts.
      operationId: listFolders
      security: *a3
    post:
      summary: Create folder
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
      tags:
        - Folders
      description: Create a new folder in library root or as a child of parentId.
      operationId: createFolder
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                parentId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
                color:
                  type: string
                icon:
                  type: string
              required:
                - name
              additionalProperties: false
  /folders/flat:
    get:
      summary: List folders flat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
      tags:
        - Folders
      description: Retrieve a flat unnested list of all folders in the active organization.
      operationId: listFoldersFlat
      security: *a3
  /folders/{id}:
    put:
      summary: Update folder
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
      tags:
        - Folders
      description: Update folder name, color, icon, or parent location with concurrency check.
      operationId: updateFolder
      security: *a3
      parameters: &a6
        - &a5
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updatedAt:
                  type: string
                  format: date-time
                name:
                  type: string
                  minLength: 1
                parentId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
                color:
                  type: string
                icon:
                  type: string
              required:
                - updatedAt
              additionalProperties: false
    delete:
      summary: Delete folder
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      tags:
        - Folders
      description: Delete folder according to the action query strategy.
      operationId: deleteFolder
      security: *a3
      parameters:
        - *a5
        - name: action
          in: query
          required: false
          schema:
            default: move_to_root
            type: string
            enum:
              - move_to_root
              - delete_songs
  /folders/{id}/move-content-to-root:
    delete:
      summary: Delete folder moving content to root
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  movedSongs:
                    type: integer
                  movedFolders:
                    type: integer
      tags:
        - Folders
      description: Delete folder and move its songs and subfolders to organization root.
      operationId: deleteFolderMoveContentToRoot
      security: *a3
      parameters: *a6
  /folders/{id}/with-content:
    delete:
      summary: Delete folder with content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      tags:
        - Folders
      description: Cascade delete a folder and all contained songs and subfolders into trash.
      operationId: deleteFolderWithContent
      security: *a3
      parameters: *a6
  /services:
    get:
      summary: List services
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
      tags:
        - Services
      description: List scheduled services with optional archived status filter.
      operationId: listServices
      security: *a3
      parameters:
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
    post:
      summary: Create service
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
      tags:
        - Services
      description: Create an order of service with service date and optional element sequence.
      operationId: createService
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - date
              properties:
                name:
                  type: string
                date:
                  type: string
                notes:
                  type: string
                elements:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceElement"
  /services/{id}:
    get:
      summary: Get service
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
      tags:
        - Services
      description: Retrieve a service order and its ordered elements by UUID.
      operationId: getService
      security: *a3
      parameters: &a7
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
    put:
      summary: Update service
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
      tags:
        - Services
      description: Update service details, notes, or archived status with concurrency check.
      operationId: updateService
      security: *a3
      parameters: *a7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updatedAt:
                  type: string
                  format: date-time
                name:
                  type: string
                  minLength: 1
                date:
                  type: string
                  minLength: 1
                notes:
                  type: string
                archived:
                  type: boolean
                elements:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                          - welcome
                          - scripture
                          - message
                          - announcement
                          - custom
                          - song
                      title:
                        type: string
                        minLength: 1
                      content:
                        type: string
                      position:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      songId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      notes:
                        type: string
                      passage:
                        type: string
                      duration:
                        type: number
                        minimum: 0
                    required:
                      - id
                      - type
                      - title
                    additionalProperties: false
              required:
                - updatedAt
              additionalProperties: false
    delete:
      summary: Delete service
      responses:
        "204":
          description: Deleted
      tags:
        - Services
      description: Soft-delete service into trash.
      operationId: deleteService
      security: *a3
      parameters: *a7
  /services/{id}/elements:
    put:
      summary: Replace service elements
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
      tags:
        - Services
      description: Reorder or replace the full element sequence for a service.
      operationId: updateServiceElements
      security: *a3
      parameters: *a7
      requestBody:
        required: true
        content:
          application/json:
            schema:
