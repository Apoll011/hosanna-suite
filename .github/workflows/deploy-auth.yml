name: Deploy Auth (production)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/auth/**"
      - "packages/auth/**"
      - "packages/brand/**"
      - "packages/config/**"
      - "packages/db/**"
      - "packages/i18n/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-auth.yml"
  workflow_dispatch:

concurrency:
  group: deploy-auth-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy → auth.hosanna.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Auth
      url: https://auth.hosanna.live

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Auth (+ workspace deps)
        run: pnpm turbo run build --filter=@hosanna/auth-app
        env:
          SKIP_ENV_VALIDATION: "true"
          AUTH_URL: https://auth.hosanna.live
          NEXT_PUBLIC_AUTH_URL: https://auth.hosanna.live
          NEXT_PUBLIC_STUDIO_URL: https://studio.hosanna.live

      - name: Deploy to Vercel
        working-directory: apps/auth
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AUTH_PROJECT_ID }}
