name: Deploy Studio (preview)

on:
  push:
    branches: [develop]
    paths:
      - "apps/studio/**"
      - "packages/auth/**"
      - "packages/brand/**"
      - "packages/chordpro/**"
      - "packages/config/**"
      - "packages/i18n/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-studio-preview.yml"
  workflow_dispatch:

concurrency:
  group: deploy-Preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy → dev-studio.hosanna.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Preview
      url: https://dev-studio.hosanna.live

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Studio (+ workspace deps)
        run: pnpm turbo run build --filter=@hosanna/studio
        env:
          # From GitHub Environment Preview (vars + secrets).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Deploy Worker (studio)
        working-directory: apps/studio
        run: pnpm exec wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
