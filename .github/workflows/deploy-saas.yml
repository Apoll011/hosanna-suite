name: Deploy SaaS (production)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/saas/**"
      - "packages/brand/**"
      - "packages/config/**"
      - "packages/i18n/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-saas.yml"
  workflow_dispatch:

concurrency:
  group: deploy-saas-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy → hosanna.live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: SaaS
      url: https://hosanna.live

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SaaS (+ workspace deps)
        run: pnpm turbo run build --filter=@hosanna/saas
        env:
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy Worker (saas)
        working-directory: apps/saas
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
