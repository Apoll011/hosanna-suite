services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosanna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hosanna}
      POSTGRES_DB: ${POSTGRES_DB:-hosanna}
    volumes:
      - hosanna_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosanna} -d ${POSTGRES_DB:-hosanna}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hosanna}:${POSTGRES_PASSWORD:-hosanna}@db:5432/${POSTGRES_DB:-hosanna}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-hosanna}:${POSTGRES_PASSWORD:-hosanna}@db:5432/${POSTGRES_DB:-hosanna}?schema=public
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      STUDIO_URL: ${STUDIO_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173,http://localhost:5174}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://127.0.0.1:3000/mcp}
    ports:
      - "${API_PORT:-3000}:3000"

  studio:
    build:
      context: .
      target: studio
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${STUDIO_PORT:-8080}:80"

volumes:
  hosanna_pgdata:
